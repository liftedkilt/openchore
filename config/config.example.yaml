settings: {}

# AI-powered features (requires LiteRT + Kokoro sidecars — see compose.yaml)
# Enable with: docker compose --profile ai up
# These settings are stored in the database and can be changed from the admin UI.
# Values here are only applied on first boot (like all config).
# For existing installs, configure via Admin > Settings > AI Photo Review.
ai:
  enabled: false
  endpoint: "http://litert:8080"     # LiteRT sidecar (or http://ollama:11434 for Ollama)
  model: "gemma4:e4b"              # Vision + text model
  auto_approve_threshold: 0.85
  tts_enabled: false
  tts_endpoint: "http://kokoro:8880"  # Kokoro-FastAPI (OpenAI-compatible TTS)
  tts_voice: "af_heart"               # Warm, kid-friendly voice

# Webhook subsystem tunables.
# These apply at server startup — changes require a restart.
webhooks:
  # How many days of webhook_deliveries (delivery attempt log) to keep before
  # a background goroutine purges older rows. The table grows with every
  # outbound webhook delivery, so unbounded retention wastes disk and slows
  # queries. Set to 0 to disable cleanup and retain forever. Default: 30.
  delivery_retention_days: 30
  # How often (in hours) the cleanup goroutine wakes up to purge old rows.
  # Default: 24 (once per day).
  delivery_cleanup_interval_hours: 24

# Authentication. Unlike the sections above, this is read on every start,
# so providers can be added to an existing install (restart required).
# Values support ${ENV_VAR} expansion to keep secrets out of this file.
# A single provider can also be configured purely with environment variables:
# OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_PROVIDER_ID,
# OIDC_PROVIDER_NAME, OIDC_SCOPES, OIDC_PROMPT (and OPENCHORE_PUBLIC_URL).
auth:
  # Externally reachable URL; used to build redirect URIs
  # (<public_url>/api/auth/oidc/<id>/callback). Defaults to the request host.
  # public_url: "https://chores.example.com"
  # kiosk_session_ttl: 12h        # tap/PIN sign-ins on shared devices
  # personal_session_ttl: 720h    # OIDC sign-ins, e.g. on a parent's phone
  oidc: []
  # oidc:
  #   - id: pocketid                # stable; stored with linked accounts
  #     name: "Pocket ID"           # button label: "Continue with Pocket ID"
  #     issuer: "https://id.example.com"
  #     client_id: "openchore"
  #     client_secret: "${POCKET_ID_CLIENT_SECRET}"
  #     prompt: login               # re-authenticate every time (shared tablets)
  #   - id: google
  #     name: "Google"
  #     issuer: "https://accounts.google.com"
  #     client_id: "1234.apps.googleusercontent.com"
  #     client_secret: "${GOOGLE_CLIENT_SECRET}"
